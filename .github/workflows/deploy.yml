name: Deploy to GitHub Pages

on:
  # 當推送到 main 分支時觸發部署 (如果你的預設分支是 master，請將 main 改為 master)
  push:
    branches:
      - main

# 設定 GITHUB_TOKEN 的權限以允許部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 確保同時間只有一個部署在執行
concurrency:
  group: "pages"
  cancel-in-progress: false

# 強制讓 GitHub Actions 執行環境使用 Node.js 24，解決 deprecation 錯誤
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 建立與打包專案
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build project
        # 直接執行 vite build 略過 ESLint 檢查，避免被 CI 環境的嚴格 Lint 警告中斷 (exit code 1)
        run: npx vite build
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite 預設打包輸出的資料夾名稱

  # 部署到 GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4